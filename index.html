<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container {
        height: 600px;
        width: 850px;
        background-color: blue;
        position: relative;
    }

    .ball {
        background-color: red;
        height: 100px;
        width: 100px;
        border-radius: 70px;
        position: absolute;
        bottom: 0;
        animation: ak 30s ease-in-out 4;
    }

    @keyframes ak {
        0% {
            transform: translateY(0px);
            left: 2px;
        }

        10% {
            transform: translateY(-450px);
            left: 2px;
        }

        20% {
            transform: translateY(0px);
        }

        30% {
            left: 70px;
            transform: translateY(-350px);
        }

        40% {
            transform: translateY(0px)
        }

        50% {
            transform: translateY(-250px);
            left: 140px;
        }
        60%{
            transform: translateY(0px);
        }
        70%{
            transform: translateY(-150px);
            left: 210px;
        }
        80%{
            transform: translateY(0px);
        }
    }
</style>

<body>
    <div class="container">

        <div class="ball translate"></div>

    </div>
</body>

</html>
